
services:
  backend:
    build:
      context: .
      dockerfile: myproject/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      post_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  reminders:
    build:
      context: .
      dockerfile: myproject/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "myproject.services.notifications", "--daily"]
    depends_on:
      post_db:
        condition: service_healthy

  post_db:
    image: postgres:18
    # Stop if a 17-or-older data volume is reused; migrate explicitly with backup.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ] || [ -f /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Legacy PostgreSQL volume detected. Backup and upgrade to 18 before deploying." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
