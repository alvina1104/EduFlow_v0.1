name: Verify EduFlow payments (isolated PostgreSQL)
on:
  push:
    branches:
      - feature/sequential-payments-college-mentor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pytest
          POSTGRES_PASSWORD: pytest
          POSTGRES_DB: eduflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytest -d eduflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://pytest:pytest@127.0.0.1:5432/eduflow_test
      TEST_DATABASE_URL: postgresql+psycopg://pytest:pytest@127.0.0.1:5432/eduflow_test
      SECRET_KEY: test-only-github-actions-key
      ENVIRONMENT: test
      FINIK_API_KEY: ""
      FINIK_ACCOUNT_ID: ""
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check isolated test database identity
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.database == "eduflow_test"
          assert url.host in {"127.0.0.1", "localhost"}
          with psycopg.connect("postgresql://pytest:pytest@127.0.0.1:5432/eduflow_test") as conn:
              assert conn.execute("SELECT current_database()").fetchone()[0] == "eduflow_test"
          print("Confirmed local isolated eduflow_test database")
          PY

      - name: Apply Alembic migrations to isolated database
        run: alembic upgrade head

      - name: Verify exact requested test files
        run: |
          pytest -q tests/test_payment_allocations.py
          pytest -q tests/test_payments_httpx.py tests/test_finik.py tests/test_api.py
